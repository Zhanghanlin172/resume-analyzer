<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能简历分析器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);min-height:100vh;color:#e2e8f0}
.container{max-width:900px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:32px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:#94a3b8;margin-top:6px;font-size:15px}
.upload-zone{background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.1);border-radius:16px;padding:48px;text-align:center;cursor:pointer;transition:all .3s}
.upload-zone:hover{border-color:#38bdf8;background:rgba(56,189,248,.05)}
.upload-zone .icon{font-size:48px;margin-bottom:12px}
.upload-zone .hint{font-size:14px;color:#64748b}
.upload-zone input{display:none}
#loading{text-align:center;padding:40px;display:none}
#loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#result{display:none}
.score-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.score-item{background:rgba(255,255,255,.05);border-radius:12px;padding:20px;text-align:center}
.score-item .num{font-size:36px;font-weight:800;color:#38bdf8}
.total-score .num{font-size:64px;color:#fff}
.score-item .label{font-size:12px;color:#94a3b8;margin-top:4px}
.level-badge{display:inline-block;padding:6px 20px;border-radius:20px;font-size:14px;font-weight:700;margin-bottom:12px}
.level-excellent{background:rgba(34,197,94,.15);color:#22c55e}
.level-good{background:rgba(56,189,248,.15);color:#38bdf8}
.level-normal{background:rgba(251,191,36,.15);color:#facc15}
.level-bad{background:rgba(239,68,68,.15);color:#f87171}
.section{margin-bottom:24px}
.section h3{font-size:15px;color:#94a3b8;margin-bottom:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;margin:2px 4px}
.tag-good{background:rgba(34,197,94,.1);color:#22c55e}
.tag-bad{background:rgba(239,68,68,.1);color:#f87171}
.tag-info{background:rgba(56,189,248,.1);color:#38bdf8}
.tag-warn{background:rgba(251,191,36,.1);color:#facc15}
.suggestions li{font-size:13px;color:#cbd5e1;margin-bottom:6px;line-height:1.6}
.file-name{color:#38bdf8;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>智能简历分析器</h1>
    <p>上传简历 PDF/TXT，获取 AI 级评分与改进建议</p>
  </div>

  <div id="uploadBox" class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📄</div>
    <div class="hint">点击上传或拖拽简历文件到这里<br>支持 PDF、TXT 格式</div>
    <div class="file-name" id="fileName"></div>
    <input type="file" id="fileInput" accept=".pdf,.txt" onchange="handleFile(this.files[0])">
  </div>

  <div id="loading"><div class="spinner"></div><p style="color:#94a3b8">正在分析简历...</p></div>
  <div id="result"></div>
</div>

<script>
async function handleFile(file) {
  if (!file) return;
  document.getElementById('fileName').textContent = '已选择：' + file.name;
  document.getElementById('uploadBox').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';

  const form = new FormData();
  form.append('file', file);

  try {
    const r = await fetch('/api/analyze', { method:'POST', body:form });
    const d = await r.json();
    document.getElementById('loading').style.display = 'none';
    if (d.success) showResult(d.resume, d.result);
    else { document.getElementById('result').innerHTML = '<p style="color:#f87171;text-align:center">'+d.error+'</p>'; document.getElementById('result').style.display='block'; }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').innerHTML = '<p style="color:#f87171;text-align:center">请求失败，请检查服务是否启动</p>';
    document.getElementById('result').style.display='block';
  }
}

function showResult(data, result) {
  const lvlClass = result.level === '优秀' ? 'level-excellent' : result.level === '良好' ? 'level-good' : result.level === '一般' ? 'level-normal' : 'level-bad';
  const lvlColor = result.level === '优秀' ? '#22c55e' : result.level === '良好' ? '#38bdf8' : result.level === '一般' ? '#facc15' : '#f87171';

  let html = '<div style="text-align:center;margin-bottom:28px">';
  html += '<span class="level-badge '+lvlClass+'">'+result.level+'</span>';
  html += '<h2 style="font-size:28px;margin:8px 0;color:'+lvlColor+'">总分 ' + result.totalScore + ' / 100</h2>';
  html += '</div>';

  html += '<div class="score-card">';
  html += '<div class="score-item"><div class="num">'+result.keywordScore+'</div><div class="label">关键词匹配</div></div>';
  html += '<div class="score-item"><div class="num">'+result.structureScore+'</div><div class="label">结构完整</div></div>';
  html += '<div class="score-item"><div class="num">'+result.experienceScore+'</div><div class="label">项目/经历</div></div>';
  html += '<div class="score-item"><div class="num">'+result.atsScore+'</div><div class="label">ATS可读性</div></div>';
  html += '</div>';

  if (result.strengths && result.strengths.length) {
    html += '<div class="section"><h3>✅ 优点</h3>';
    result.strengths.forEach(s => html += '<span class="tag tag-good">'+s+'</span>');
    html += '</div>';
  }

  if (result.weaknesses && result.weaknesses.length) {
    html += '<div class="section"><h3>⚠️ 不足</h3>';
    result.weaknesses.forEach(w => html += '<span class="tag tag-bad">'+w+'</span>');
    html += '</div>';
  }

  if (result.missingKeywords && result.missingKeywords.length) {
    html += '<div class="section"><h3>🔑 建议添加的关键词</h3>';
    result.missingKeywords.forEach(k => html += '<span class="tag tag-warn">'+k+'</span>');
    html += '</div>';
  }

  if (result.suggestions && result.suggestions.length) {
    html += '<div class="section"><h3>💡 优化建议</h3><ul class="suggestions">';
    result.suggestions.forEach(s => html += '<li>'+s+'</li>');
    html += '</ul></div>';
  }

  html += '<div style="text-align:center;margin-top:24px"><button onclick="reset()" style="padding:10px 28px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);cursor:pointer;font-size:14px">← 分析另一份简历</button></div>';

  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
}

function reset() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('uploadBox').style.display = 'block';
  document.getElementById('fileInput').value = '';
  document.getElementById('fileName').textContent = '';
}
</script>
</body>
</html>
